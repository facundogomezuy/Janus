<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Ícono de la app: fuente para `npm run icons` (genera .ico/.png/.icns). -->
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#18241f"/>
      <stop offset="0.55" stop-color="#0f1513"/>
      <stop offset="1" stop-color="#080b0d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.44" r="0.56">
      <stop offset="0" stop-color="#1D9E75" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#1D9E75" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#1D9E75" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fe0b4"/>
