[project]
name = "janus-backend"
version = "0.1.0"
description = "Backend del interceptor de tráfico HTTP/HTTPS Janus"
requires-python = ">=3.13"
dependencies = [
    "mitmproxy>=12.2,<13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.16"]

[project.scripts]
janus-backend = "janus.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["janus", "janus.proxy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
