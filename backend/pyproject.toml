[project]
name = "janus-backend"
version = "0.0.1"
description = "Backend del interceptor de tráfico HTTP/HTTPS Janus"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # Motor de interceptación. Se usa a partir de M1.
    "mitmproxy>=11.0",
]

[project.scripts]
janus-backend = "janus.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["janus", "janus.proxy"]
