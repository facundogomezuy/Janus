name: build

# Tests del backend en cada push/PR. Instaladores al taggear (v*) o a mano;
# al taggear, además, el release de GitHub con los instaladores.
# Compilar por-SO es obligatorio: no se cross-compila cómodo (ARCHITECTURE.md §9).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
      - name: Tests
        run: python -m pytest backend/tests -q

  bundle:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Deps de Linux para Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller
          npm ci

      - name: Congelar el backend (sidecar)
        run: npm run backend:build
        env:
          JANUS_PYTHON: python

      # El .exe sin consola tiene que hablar por los pipes que usa Tauri.
      - name: Prueba de humo del sidecar
        run: python scripts/smoke-sidecar.py
        env:
          PYTHONUTF8: "1"

      - name: Build de la app (Tauri)
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v6
        with:
          name: janus-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # Al taggear v*: release de GitHub con los instaladores y sus SHA256.
  # Las notas salen de docs/releases/<tag>.md; si el release ya existe, se
  # actualizan las notas y se reemplazan los archivos (re-correr es seguro).
  release:
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          pattern: janus-*
          path: dist
          merge-multiple: true

      - name: Publicar el release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mapfile -t files < <(find dist -type f \( -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' \) | sort)
          if [ "${#files[@]}" -eq 0 ]; then echo "no hay instaladores"; exit 1; fi
          for f in "${files[@]}"; do (cd "$(dirname "$f")" && sha256sum "$(basename "$f")"); done > SHA256SUMS.txt
          cat SHA256SUMS.txt
          notes="docs/releases/${TAG}.md"
          [ -f "$notes" ] || { echo "falta $notes"; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Janus ${TAG}" --notes-file "$notes"
            gh release upload "$TAG" "${files[@]}" SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" "${files[@]}" SHA256SUMS.txt --title "Janus ${TAG}" --notes-file "$notes"
          fi
