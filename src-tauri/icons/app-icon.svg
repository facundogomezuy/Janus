  <rect x="48" y="48" width="928" height="928" rx="214" fill="url(#bg)"/>
  <rect x="48" y="48" width="928" height="928" rx="214" fill="url(#glow)"/>
  <rect x="50" y="50" width="924" height="924" rx="212" fill="none" stroke="url(#rim)" stroke-width="4"/>
  <g transform="translate(512 512) scale(11.6) translate(-32 -32)" fill="none" stroke="url(#mark)" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="32" cy="32" r="22" stroke-width="4.4"/>
    <path d="M27,23 L20,32 L27,41" stroke-width="3.6"/>
    <path d="M37,23 L44,32 L37,41" stroke-width="3.6"/>
    <path d="M33,25.5 L27.5,32 L33,38.5" stroke-width="2.6" stroke-opacity="0.55"/>
    <path d="M31,25.5 L36.5,32 L31,38.5" stroke-width="2.6" stroke-opacity="0.55"/>
