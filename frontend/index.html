<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Janus</title>
<link rel="icon" type="image/svg+xml" href="assets/janus-mark.svg" />
<style>
  :root {
    --teal: #1D9E75;
    --teal-strong: #0F6E56;
    --teal-soft: #5DCAA5;
    --radius: 8px;
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  /* Tema oscuro (default) */
  html[data-theme="dark"] {
    --bg: #0e1013;
    --surface-0: #14161a;
    --surface-1: #1a1d22;
    --surface-2: #23272e;
    --border: #2b2f37;
    --border-strong: #3a3f49;
    --text: #e6e8ea;
    --text-2: #9aa1ab;
    --text-3: #6b7280;
    --ok: #5DCAA5;
    --warn: #EF9F27;
    --err: #E24B4A;
    --sel: rgba(29,158,117,0.16);
  }
  /* Tema claro */
  html[data-theme="light"] {
    --bg: #f6f7f5;
    --surface-0: #ffffff;
    --surface-1: #f1f2ef;
    --surface-2: #ffffff;
    --border: #e2e3df;
    --border-strong: #c9cbc4;
    --text: #1b1c1a;
    --text-2: #5f625c;
    --text-3: #8a8d86;
    --ok: #0F6E56;
    --warn: #854F0B;
    --err: #A32D2D;
    --sel: rgba(29,158,117,0.12);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* --- Title bar --- */
  .titlebar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; background: var(--surface-0);
    border-bottom: 1px solid var(--border); flex: none;
  }
  .brand { display: flex; align-items: center; gap: 9px; }
  .brand svg { display: block; }
  .brand .name { font-size: 15px; font-weight: 500; letter-spacing: .5px; }
  .status-group { display: flex; align-items: center; gap: 8px; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; padding: 4px 9px; border-radius: 20px;
    border: 1px solid var(--border-strong); color: var(--text-2);
    background: transparent; cursor: pointer; user-select: none;
    font-family: var(--font-sans);
  }
  .pill.live { color: var(--ok); border-color: transparent; background: rgba(93,202,165,.12); cursor: default; }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pill.intercept-on { color: var(--warn); border-color: var(--warn); background: rgba(239,159,39,.12); }

  /* --- Tabs --- */
  .tabs {
    display: flex; gap: 3px; padding: 5px 8px; background: var(--surface-0);
    border-bottom: 1px solid var(--border); flex: none; overflow-x: auto;
  }
  .tab {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; padding: 6px 11px; border-radius: var(--radius);
    color: var(--text-2); white-space: nowrap; cursor: pointer; border: none; background: none;
    font-family: var(--font-sans);
  }
  .tab .ico { width: 14px; height: 14px; }
  .tab.active { color: var(--teal); background: var(--sel); font-weight: 500; }
  .tab:not(.active):hover { color: var(--text); }

  /* --- Toolbar --- */
  .toolbar {
    display: flex; align-items: center; gap: 8px; padding: 7px 12px;
    background: var(--surface-0); border-bottom: 1px solid var(--border); flex: none;
  }
  .toolbar input[type="search"] {
    flex: 1; min-width: 0; height: 30px; padding: 0 10px;
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text); font-size: 12px;
    font-family: var(--font-mono);
  }
  .toolbar input::placeholder { color: var(--text-3); }
  .check { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); cursor: pointer; white-space: nowrap; }

  /* --- Main split --- */
  .main { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  .history { flex: 1.1; min-height: 0; overflow: auto; }
  table.flows { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 11.5px; }
  table.flows thead th {
    position: sticky; top: 0; z-index: 1;
    text-align: left; font-weight: 400; color: var(--text-3);
    padding: 7px 12px; background: var(--surface-1); border-bottom: 1px solid var(--border);
  }
  table.flows td { padding: 7px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.flows tbody tr { cursor: pointer; }
  table.flows tbody tr:hover { background: var(--surface-1); }
  table.flows tbody tr.selected { background: var(--sel); }
  td.path { max-width: 1px; width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .verb-GET { color: var(--teal-soft); }
  .verb-POST, .verb-PUT, .verb-DELETE, .verb-PATCH { color: var(--teal); }
  .st-2 { color: var(--ok); } .st-3 { color: var(--warn); } .st-4, .st-5 { color: var(--err); }
  .oos { color: var(--text-3); }
  .oos-badge { font-family: var(--font-sans); font-size: 9.5px; color: var(--text-3); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; margin-left: 6px; }

  /* --- Detail --- */
  .detail { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; border-top: 2px solid var(--border-strong); }
  .pane { min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
  .pane + .pane { border-left: 1px solid var(--border); }
  .pane .hdr { font-size: 11px; color: var(--text-3); padding: 6px 10px; background: var(--surface-1); border-bottom: 1px solid var(--border); flex: none; }
  .pane pre { margin: 0; padding: 10px; overflow: auto; flex: 1; font-family: var(--font-mono); font-size: 11.5px; line-height: 1.6; color: var(--text-2); white-space: pre-wrap; word-break: break-all; }
  .pane .k { color: var(--text-3); }
  .pane .m { color: var(--teal); }
  .pane .s-ok { color: var(--ok); } .pane .s-warn { color: var(--warn); } .pane .s-err { color: var(--err); }
  .empty { color: var(--text-3); padding: 14px; font-style: italic; }

  /* --- Action bar --- */
  .actionbar { display: flex; gap: 7px; padding: 8px 12px; background: var(--surface-0); border-top: 1px solid var(--border); flex: none; }
  .btn { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-2); border: 1px solid var(--border-strong); background: transparent; border-radius: var(--radius); padding: 5px 11px; cursor: pointer; font-family: var(--font-sans); }
  .btn:hover { color: var(--text); border-color: var(--teal); }
  .btn .ico { width: 13px; height: 13px; }
  .spacer { flex: 1; }
  .footnote { font-size: 10.5px; color: var(--text-3); align-self: center; }
</style>
</head>
<body>

  <div class="titlebar">
    <div class="brand">
      <svg viewBox="0 0 64 64" width="26" height="26" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="32" cy="32" r="22" stroke="var(--teal)" stroke-width="4.2"/>
        <path d="M27,23 L20,32 L27,41" stroke="var(--teal)" stroke-width="3.2"/>
        <path d="M37,23 L44,32 L37,41" stroke="var(--teal)" stroke-width="3.2"/>
        <path d="M33,25.5 L27.5,32 L33,38.5" stroke="var(--teal)" stroke-width="2.4" stroke-opacity="0.5"/>
        <path d="M31,25.5 L36.5,32 L31,38.5" stroke="var(--teal)" stroke-width="2.4" stroke-opacity="0.5"/>
      </svg>
      <span class="name">janus</span>
    </div>
    <div class="status-group">
      <span class="pill live" id="proxy-pill"><span class="dot"></span>proxy :8080</span>
      <button class="pill" id="intercept-pill" aria-pressed="false">
        <svg class="ico" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0M14 10V4a2 2 0 0 0-4 0v2M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>
        <span id="intercept-label">intercept off</span>
      </button>
      <button class="pill" id="theme-toggle" title="Cambiar tema" aria-label="Cambiar tema" style="padding:5px 8px;">
        <svg class="ico" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>

  <nav class="tabs">
    <button class="tab active" data-tab="history">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.7 9.7 0 0 0-6.7 2.9L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>
      History
    </button>
    <button class="tab" data-tab="intercept">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0M14 10V4a2 2 0 0 0-4 0v2M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>
      Intercept
    </button>
    <button class="tab" data-tab="repeater">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 8-8 8 8 0 0 1 6.9 4"/><path d="M20 4v4h-4"/><path d="M20 12a8 8 0 0 1-8 8 8 8 0 0 1-6.9-4"/><path d="M4 20v-4h4"/></svg>
      Repeater
    </button>
    <button class="tab" data-tab="scope">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>
      Scope
    </button>
    <button class="tab" data-tab="ca">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="6"/><path d="M9 14l-1.5 7L12 19l4.5 2L15 14"/></svg>
      CA
    </button>
  </nav>

  <div class="toolbar">
    <input type="search" id="filter" placeholder="filtrar por host o path…" />
    <label class="check"><input type="checkbox" id="scope-only" /> solo scope</label>
  </div>

  <div class="main">
    <div class="history">
      <table class="flows">
        <thead>
          <tr>
            <th style="width:70px;">time</th>
            <th style="width:52px;">verb</th>
            <th>host / path</th>
            <th style="width:44px;">st</th>
            <th style="width:56px;">len</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <div class="detail">
      <div class="pane">
        <div class="hdr">request</div>
        <pre id="req"><span class="empty">seleccioná una fila</span></pre>
      </div>
      <div class="pane">
        <div class="hdr">response</div>
        <pre id="res"><span class="empty">—</span></pre>
      </div>
    </div>
  </div>

  <div class="actionbar">
    <button class="btn"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 8-8 8 8 0 0 1 6.9 4"/><path d="M20 4v4h-4"/><path d="M20 12a8 8 0 0 1-8 8 8 8 0 0 1-6.9-4"/><path d="M4 20v-4h4"/></svg>enviar a repeater</button>
    <button class="btn"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>agregar a scope</button>
    <span class="spacer"></span>
    <span class="footnote" id="conn">data falsa (M0)</span>
  </div>

<script>
// --- Data falsa embebida: fallback para abrir el index suelto sin backend. ---
const EMBEDDED = [
  {id:"f-0011",ts:"18:04:12",method:"POST",scheme:"https",host:"api.target.com",port:443,path:"/token",status_code:401,reason:"Unauthorized",length:60,duration_ms:142,in_scope:true,
    request:{headers:{Host:"api.target.com","Content-Type":"application/json",Accept:"*/*"},body:'{"grant_type":"password","username":"admin","password":"hunter2"}'},
    response:{headers:{"Content-Type":"application/json","WWW-Authenticate":"Bearer"},body:'{"error":"invalid_grant","error_description":"bad credentials"}'}},
  {id:"f-0012",ts:"18:04:20",method:"GET",scheme:"https",host:"target.com",port:443,path:"/dashboard",status_code:302,reason:"Found",length:0,duration_ms:61,in_scope:true,
    request:{headers:{Host:"target.com",Cookie:"sid=abc123",Accept:"text/html"},body:""},
    response:{headers:{Location:"/login","Set-Cookie":"sid=; Max-Age=0"},body:""}},
  {id:"f-0013",ts:"18:04:33",method:"GET",scheme:"https",host:"api.target.com",port:443,path:"/me",status_code:200,reason:"OK",length:64,duration_ms:88,in_scope:true,
    request:{headers:{Host:"api.target.com",Authorization:"Bearer eyJhbGci...",Accept:"application/json"},body:""},
    response:{headers:{"Content-Type":"application/json","Cache-Control":"no-store"},body:'{"id":42,"user":"admin","roles":["staff","billing"],"mfa":false}'}},
  {id:"f-0014",ts:"18:04:41",method:"POST",scheme:"https",host:"api.target.com",port:443,path:"/login",status_code:200,reason:"OK",length:70,duration_ms:203,in_scope:true,
    request:{headers:{Host:"api.target.com","Content-Type":"application/json",Origin:"https://target.com"},body:'{"user":"admin","pass":"correct-horse"}'},
    response:{headers:{"Content-Type":"application/json","Set-Cookie":"sid=9f2a...; HttpOnly; Secure"},body:'{"token":"eyJhbGciOiJIUzI1NiJ9...","expires_in":3600,"scope":"full"}'}},
  {id:"f-0015",ts:"18:04:52",method:"GET",scheme:"https",host:"cdn.assets.io",port:443,path:"/app.4f2.js",status_code:200,reason:"OK",length:512,duration_ms:512,in_scope:false,
    request:{headers:{Host:"cdn.assets.io",Accept:"*/*",Referer:"https://target.com/"},body:""},
    response:{headers:{"Content-Type":"application/javascript","Cache-Control":"max-age=31536000"},body:"// (bundle minificado, 214 KB)"}},
  {id:"f-0016",ts:"18:05:03",method:"PUT",scheme:"https",host:"api.target.com",port:443,path:"/users/42/email",status_code:403,reason:"Forbidden",length:58,duration_ms:97,in_scope:true,
    request:{headers:{Host:"api.target.com",Authorization:"Bearer eyJhbGci...","Content-Type":"application/json"},body:'{"email":"attacker@evil.com"}'},
    response:{headers:{"Content-Type":"application/json"},body:'{"error":"forbidden","detail":"missing scope: users:write"}'}},
];

const $ = (s) => document.querySelector(s);
let flows = [];
let byId = {};
let selected = null;

function fmtLen(n){ return n >= 1000 ? (n/1000).toFixed(1)+"k" : String(n); }
function stClass(code){ return "st-" + String(code)[0]; }
function esc(s){ return String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function renderRows(){
  const filter = $("#filter").value.trim().toLowerCase();
  const scopeOnly = $("#scope-only").checked;
  const tbody = $("#rows");
  tbody.innerHTML = "";
  flows
    .filter(f => !scopeOnly || f.in_scope)
    .filter(f => !filter || f.host.toLowerCase().includes(filter) || f.path.toLowerCase().includes(filter))
    .forEach(f => {
      const tr = document.createElement("tr");
      tr.dataset.id = f.id;
      if (selected === f.id) tr.classList.add("selected");
      const oos = f.in_scope ? "" : '<span class="oos-badge">out</span>';
      tr.innerHTML =
        `<td>${f.ts}</td>` +
        `<td class="verb-${f.method}">${f.method}</td>` +
        `<td class="path ${f.in_scope?'':'oos'}">${esc(f.host)}${esc(f.path)}${oos}</td>` +
        `<td class="${stClass(f.status_code)}">${f.status_code}</td>` +
        `<td>${fmtLen(f.length)}</td>`;
      tr.addEventListener("click", () => select(f.id));
      tbody.appendChild(tr);
    });
}

function headersBlock(h){
  return Object.entries(h).map(([k,v]) => `<span class="k">${esc(k)}:</span> ${esc(v)}`).join("\n");
}

function select(id){
  selected = id;
  const f = byId[id];
  renderRows();
  const reqLine = `<span class="m">${f.method}</span> ${esc(f.path)} ${f.scheme.toUpperCase()}/1.1`;
  $("#req").innerHTML = reqLine + "\n" + headersBlock(f.request.headers) +
    (f.request.body ? "\n\n" + esc(f.request.body) : "");
  const sc = f.status_code, scls = sc<300?"s-ok":sc<400?"s-warn":"s-err";
  $("#res").innerHTML = `HTTP/1.1 <span class="${scls}">${sc} ${esc(f.reason)}</span>\n` +
    headersBlock(f.response.headers) + (f.response.body ? "\n\n" + esc(f.response.body) : "");
}

async function load(){
  const conn = $("#conn");
  try {
    const r = await fetch("/api/history", { headers: authHeader() });
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    // El listado no trae cuerpos; los pedimos por detalle al seleccionar.
    // Para M0 basta con lo que ya viene; hidratamos detalle on-demand.
    flows = data.flows;
    // hidratar cuerpos on-demand:
    byId = {};
    flows.forEach(f => { byId[f.id] = f; });
    await hydrate();
    conn.textContent = "conectado al backend";
    conn.style.color = "var(--ok)";
  } catch (e) {
    flows = EMBEDDED;
    byId = {}; flows.forEach(f => byId[f.id] = f);
    conn.textContent = "data falsa (M0, sin backend)";
  }
  renderRows();
  if (flows.length) select(flows[0].id);
}

async function hydrate(){
  await Promise.all(flows.map(async f => {
    if (f.request) return;
    try {
      const r = await fetch("/api/history/" + f.id, { headers: authHeader() });
      if (r.ok) byId[f.id] = await r.json();
    } catch (_) {}
  }));
}

// El token lo inyecta Tauri; en dev standalone no hace falta.
function authHeader(){
  const t = window.__JANUS_TOKEN__;
  return t ? { "Authorization": "Bearer " + t } : {};
}

// --- Interacciones de UI (visuales por ahora) ---
$("#intercept-pill").addEventListener("click", (e) => {
  const p = e.currentTarget;
  const on = p.classList.toggle("intercept-on");
  p.setAttribute("aria-pressed", on);
  $("#intercept-label").textContent = on ? "intercept on" : "intercept off";
});
$("#theme-toggle").addEventListener("click", () => {
  const html = document.documentElement;
  html.dataset.theme = html.dataset.theme === "dark" ? "light" : "dark";
});
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  document.querySelector(".tab.active").classList.remove("active");
  t.classList.add("active");
}));
$("#filter").addEventListener("input", renderRows);
$("#scope-only").addEventListener("change", renderRows);

load();
</script>
</body>
</html>
